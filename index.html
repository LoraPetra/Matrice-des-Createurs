<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Matrice des Créateurs</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #00FF41; font-family: 'Courier New', Courier, monospace; }
        .background-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.75; }
        .interface { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .hidden { opacity: 0 !important; pointer-events: none !important; }
        .visible { opacity: 1 !important; pointer-events: auto !important; }

        .titre-intro { position: absolute; top: 8vh; width: 100%; text-align: center; font-size: 2.8rem; transition: opacity 0.5s; text-shadow: 0 0 20px #00FF41, 0 0 5px #000000; }
        
        .bouton-entrer { position: absolute; top: 50%; right: 10vw; transform: translateY(-50%); background: rgba(0,0,0,0.8); color: #00FF41; border: 2px solid #00FF41; padding: 20px 40px; font-size: 1.5rem; font-weight: bold; font-family: inherit; cursor: pointer; border-radius: 10px; transition: all 0.3s; opacity: 0; pointer-events: none; box-shadow: 0 0 20px #00FF41; }
        .bouton-entrer:hover { background: #00FF41; color: #000; box-shadow: 0 0 30px #ffffff; }

        @keyframes apparition-permanente { 0% { opacity: 0; } 100% { opacity: 1; } }
        .texte-neo-discret { position: absolute; bottom: 5vh; left: 3vw; width: 80%; max-width: 350px; font-size: 0.85rem; line-height: 1.4; text-shadow: 0 0 5px #00FF41; background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 8px; border-left: 2px solid #00FF41; opacity: 0; }
        .texte-discret-actif { animation: apparition-permanente 2s ease-in-out 13s forwards; pointer-events: auto; }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline class="background-video">
        <source src="MvpLMDC1.mp4" type="video/mp4">
    </video>
    
    <div class="interface">
        <h1 id="titre" class="titre-intro">Bienvenue dans La Matrice des Créateurs.</h1>
        <button id="bouton" class="bouton-entrer">CLIQUE ICI</button>
        <p id="texte-discret" class="texte-neo-discret">"Bonjour, je suis Néo. Remplis tes accès ci-dessus pour entrer dans la gratuité de La Matrice. Freedom."</p>
    </div>

    <script>
        const video = document.getElementById('bg-video');
        const titre = document.getElementById('titre');
        const bouton = document.getElementById('bouton');
        const texteDiscret = document.getElementById('texte-discret');

        video.addEventListener('timeupdate', () => {
            // À 3 secondes : le titre disparaît et le bouton apparaît
            if (video.currentTime >= 3) {
                titre.classList.add('hidden');
                bouton.classList.add('visible');
            }
        });

        // Le texte en bas à gauche se déclenche tout seul
        texteDiscret.classList.add('texte-discret-actif');
    </script>
</body>
</html>
