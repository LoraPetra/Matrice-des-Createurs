<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Matrice des Créateurs</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.75;
        }

        .interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- LE MOTEUR TEMPOREL --- */
        @keyframes sequence-titre {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; } /* Disparaît à la fin de ses 3s */
        }

        @keyframes sequence-texte {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; } /* Disparaît à la fin de ses 4s */
        }

        @keyframes sequence-bouton {
            0% { opacity: 0; }
            100% { opacity: 1; } /* Reste affiché pour le clic */
        }

        /* ÉTAPE 1 : Le titre (0 à 3 secondes) */
        .titre-intro {
            position: absolute;
            top: 8vh;
            width: 100%;
            text-align: center;
            font-size: 2.8rem;
            text-shadow: 0 0 20px #00FF41, 0 0 5px #000000;
            margin: 0;
            opacity: 0;
            animation: sequence-titre 3s ease-in-out forwards;
        }

        /* ÉTAPE 2 : Le texte (3 à 7 secondes) */
        .texte-neo {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            font-size: 1.2rem;
            line-height: 1.6;
            text-shadow: 0 0 10px #00FF41;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            /* Attend 3s, puis joue pendant 4s */
            animation: sequence-texte 4s ease-in-out 3s forwards; 
        }

        /* ÉTAPE 3 : Le bouton (7 secondes et plus) */
        .bouton-acces {
            position: absolute;
            top: 50%;
            right: 10vw;
            transform: translateY(-50%);
            pointer-events: auto;
            
            background-color: #00FF41; 
            color: #000000; 
            border: none;
            box-shadow: 0 0 30px #00FF41;
            
            padding: 15px 40px;
            font-size: 1.3rem;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            
            opacity: 0;
            /* Attend 7s (3+4), puis joue pendant 2s et reste fixe */
            animation: sequence-bouton 2s ease-in-out 7s forwards;
        }

        .bouton-acces:hover {
            background-color: #ffffff;
            box-shadow: 0 0 40px #ffffff;
        }

        @media (max-width: 768px) {
            .titre-intro { font-size: 1.8rem; top: 5vh; }
            .bouton-acces {
                top: auto;
                bottom: 25vh;
                right: 50%;
                transform: translateX(50%);
            }
            .texte-neo { bottom: 2vh; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="background-video">
        <source src="MvpLMDC1.mp4" type="video/mp4">
    </video>
    
    <div class="interface">
        <h1 class="titre-intro">Bienvenue dans La Matrice des Créateurs.</h1>
        <p class="texte-neo">"Bonjour, je suis Néo. Clique ici pour avoir accès à la gratuité cette semaine de tout ce que je peux te proposer pour reprendre le contrôle sur ta vie privée et professionnelle. Freedom."</p>
        <button class="bouton-acces">Clique ici</button>
    </div>

</body>
</html>
