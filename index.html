<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Matrice des Créateurs</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.5;
        }
        .cadre-texte {
            z-index: 1;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00FF41;
            box-shadow: 0 0 20px #00FF41;
            max-width: 800px;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00FF41;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .bouton-acces {
            padding: 15px 30px;
            background-color: transparent;
            color: #00FF41;
            border: 2px solid #00FF41;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }
        .bouton-acces:hover {
            background-color: #00FF41;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- La vidéo en plein écran, silencieuse -->
    <video autoplay loop muted playsinline class="background-video">
        <source src="Vidéo Mvp LMDC Néo 1.0.mp4" type="video/mp4">
    </video>
    
    <!-- Le cadre avec ton texte par-dessus -->
    <div class="cadre-texte">
        <h1>Bienvenue dans La Matrice des Créateurs.</h1>
        <p>"Bonjour, je suis Néo. Clique ici pour avoir accès à la gratuité cette semaine de tout ce que je peux te proposer pour reprendre le contrôle sur ta vie privée et professionnelle. Freedom."</p>
        <button class="bouton-acces">Clique ici</button>
    </div>

</body>
</html>
